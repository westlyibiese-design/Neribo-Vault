name: Generate release keystore

# Run this ONCE, by hand, to create the key that signs the release build.
# You choose the password when you press "Run workflow". Write it down: it cannot be recovered.
# See docs/RELEASE.md for the full phone-friendly steps.
on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: "Password you choose for the keystore (at least 8 characters, no spaces)"
        required: true
        type: string
      key_password:
        description: "Key password: type exactly the same password again"
        required: true
        type: string

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Generate release keystore
        env:
          STORE_PASS: ${{ inputs.keystore_password }}
          KEY_PASS: ${{ inputs.key_password }}
        run: |
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          if [ "${#STORE_PASS}" -lt 8 ]; then
            echo "The password must be at least 8 characters long."
            exit 1
          fi
          if [ "$STORE_PASS" != "$KEY_PASS" ]; then
            echo "The two passwords are different. Run the workflow again and type the same password in both boxes."
            exit 1
          fi
          keytool -genkeypair -v \
            -keystore neribo-release.keystore \
            -storetype PKCS12 \
            -alias neribo \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Neribo Vault, O=Westly Ibiese, C=NG"
      - uses: actions/upload-artifact@v4
        with:
          name: neribo-release-keystore
          path: neribo-release.keystore
          retention-days: 1
